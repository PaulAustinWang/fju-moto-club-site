    <path d="M-21 23A21 21 0 0 1 21 23" stroke="#f3ead3" stroke-width="2.1"/>
    <path d="M-12 23A12 12 0 0 1 12 23" stroke="#c9a227" stroke-width="2.1"/>
    <polygon points="-34,18 -30,24 -34,30 -38,24" fill="#c9a227" stroke="none"/>
    <polygon points="34,18 38,24 34,30 30,24" fill="#c9a227" stroke="none"/>
