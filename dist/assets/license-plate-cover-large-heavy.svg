<svg xmlns="http://www.w3.org/2000/svg" width="300mm" height="150mm" viewBox="0 0 300 150" role="img" aria-labelledby="title desc">
  <title id="title">二輪社大型重型機車車牌罩 300mm x 150mm</title>
  <desc id="desc">依台灣大型重型機車號牌 300mm x 150mm 比例製作的車牌罩設計。</desc>
  <style>
    * {
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
  </style>
  <defs>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#174844" stroke-width="0.25"/>
    </pattern>
  </defs>

  <rect width="300" height="150" rx="4" fill="#0b302e"/>
  <rect width="300" height="150" rx="4" fill="url(#grid)"/>
  <rect x="4" y="4" width="292" height="142" rx="3" fill="#103b38" stroke="#c9a227" stroke-width="3.2"/>
  <rect x="10" y="10" width="280" height="130" rx="2" fill="none" stroke="#f3ead3" stroke-width="0.9"/>
  <rect x="15" y="15" width="270" height="120" rx="1.5" fill="none" stroke="#c9a227" stroke-width="0.6"/>

  <g fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linecap="square">
    <path d="M23 37V23H49"/>
    <path d="M277 37V23H251"/>
    <path d="M23 113V127H49"/>
    <path d="M277 113V127H251"/>
