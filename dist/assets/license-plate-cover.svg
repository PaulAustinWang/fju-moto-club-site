<svg xmlns="http://www.w3.org/2000/svg" width="260mm" height="140mm" viewBox="0 0 260 140" role="img" aria-labelledby="title desc">
  <title id="title">二輪社台灣機車車牌罩 260mm x 140mm</title>
  <desc id="desc">依台灣新式普通重型、輕型、小型輕型機車號牌 260mm x 140mm 比例製作的車牌罩設計。</desc>
  <style>
