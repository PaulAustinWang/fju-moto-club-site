<svg viewBox="0 0 1080 1440" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1440" fill="#123B3A"/>

  <!-- 外框 -->
  <rect x="30" y="30" width="1020" height="1380" fill="none" stroke="#C9A227" stroke-width="3"/>
  <rect x="42" y="42" width="996" height="1356" fill="none" stroke="#F3EAD3" stroke-width="1" opacity="0.6"/>

  <!-- 階梯式轉角裝飾 -->
  <polyline points="30,100 30,70 70,70 70,40 100,40 100,30" fill="none" stroke="#C9A227" stroke-width="3"/>
  <polyline points="1050,100 1050,70 1010,70 1010,40 980,40 980,30" fill="none" stroke="#C9A227" stroke-width="3"/>
  <polyline points="30,1340 30,1370 70,1370 70,1400 100,1400 100,1410" fill="none" stroke="#C9A227" stroke-width="3"/>
  <polyline points="1050,1340 1050,1370 1010,1370 1010,1400 980,1400 980,1410" fill="none" stroke="#C9A227" stroke-width="3"/>

  <!-- 小型扇形放射弧線 -->
  <g fill="none" stroke-width="3">
    <path d="M 440 300 A 100 100 0 0 1 640 300" stroke="#C9A227"/>
    <path d="M 420 300 A 120 120 0 0 1 660 300" stroke="#F3EAD3"/>
    <path d="M 400 300 A 140 140 0 0 1 680 300" stroke="#C9A227"/>
    <path d="M 380 300 A 160 160 0 0 1 700 300" stroke="#F3EAD3"/>
  </g>

  <!-- LOGO 預留徽章 -->
  <circle cx="540" cy="300" r="70" fill="#123B3A" stroke="#C9A227" stroke-width="4"/>
  <circle cx="540" cy="300" r="56" fill="none" stroke="#F3EAD3" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="540" y="307" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" letter-spacing="2" fill="#C9A227">LOGO</text>

  <!-- 標題 -->
  <text x="540" y="410" text-anchor="middle" font-family="Georgia,'Noto Serif TC',serif" font-weight="700" font-size="54" letter-spacing="4" fill="#F3EAD3">常見問題</text>
  <line x1="450" y1="435" x2="630" y2="435" stroke="#C9A227" stroke-width="2"/>

  <!-- Q&A 1 -->
  <g>
    <circle cx="110" cy="530" r="22" fill="#C9A227"/>
    <text x="110" y="538" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#123B3A">Q</text>
    <text x="150" y="538" font-family="Georgia,'Noto Serif TC',serif" font-weight="700" font-size="32" fill="#F3EAD3">加入社團需要什麼條件？</text>

    <circle cx="110" cy="594" r="20" fill="none" stroke="#C9A227" stroke-width="2"/>
    <text x="110" y="601" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#C9A227">A</text>
    <text x="150" y="602" font-family="Georgia,'Noto Serif TC',serif" font-size="26" fill="#F3EAD3" opacity="0.85">持有重型機車駕照即可，新手車友備有陪騎教學</text>

    <line x1="90" y1="670" x2="990" y2="670" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="2 7" opacity="0.6"/>
  </g>

  <!-- Q&A 2 -->
  <g>
    <circle cx="110" cy="720" r="22" fill="#C9A227"/>
    <text x="110" y="728" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#123B3A">Q</text>
    <text x="150" y="728" font-family="Georgia,'Noto Serif TC',serif" font-weight="700" font-size="32" fill="#F3EAD3">每月聚會頻率為何？</text>

    <circle cx="110" cy="784" r="20" fill="none" stroke="#C9A227" stroke-width="2"/>
    <text x="110" y="791" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#C9A227">A</text>
    <text x="150" y="792" font-family="Georgia,'Noto Serif TC',serif" font-size="26" fill="#F3EAD3" opacity="0.85">每月至少一次團騎，另有不定期社課與聚餐</text>

    <line x1="90" y1="860" x2="990" y2="860" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="2 7" opacity="0.6"/>
  </g>

  <!-- Q&A 3 -->
  <g>
    <circle cx="110" cy="910" r="22" fill="#C9A227"/>
    <text x="110" y="918" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="22" fill="#123B3A">Q</text>
    <text x="150" y="918" font-family="Georgia,'Noto Serif TC',serif" font-weight="700" font-size="32" fill="#F3EAD3">需要繳交社費嗎？</text>

    <circle cx="110" cy="974" r="20" fill="none" stroke="#C9A227" stroke-width="2"/>
    <text x="110" y="981" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#C9A227">A</text>
    <text x="150" y="982" font-family="Georgia,'Noto Serif TC',serif" font-size="26" fill="#F3EAD3" opacity="0.85">年費 500 元，用於活動場地與保險費用</text>
  </g>

  <!-- 幾何鋸齒飾帶 -->
  <polyline points="90,1220 165,1200 240,1240 315,1200 390,1240 465,1200 540,1240 615,1200 690,1240 765,1200 840,1240 915,1200 990,1220"
    fill="none" stroke="#C9A227" stroke-width="4"/>
  <polyline points="90,1260 165,1240 240,1280 315,1240 390,1280 465,1240 540,1280 615,1240 690,1280 765,1240 840,1280 915,1240 990,1260"
    fill="none" stroke="#F3EAD3" stroke-width="2" opacity="0.7"/>

  <!-- 頁尾 -->
  <text x="90" y="1370" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" letter-spacing="2" fill="#C9A227">@moto.club.tw</text>
  <text x="990" y="1370" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" letter-spacing="3" fill="#C9A227">FAQ · 01</text>
</svg>
